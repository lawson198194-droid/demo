<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Baseball Growth Coach · 莀安 Demo v8.5 (快计=训练日志+字段全空+周总)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(135deg,#f4f7fb 0%,#e8eef7 100%);
    min-height:100vh; display:flex; justify-content:center; align-items:center;
    padding:20px 0; color:#1f3a5f;
  }
  .desktop-hint { position:fixed; top:14px; left:14px; color:#7a8aa1; font-size:12px; background:rgba(255,255,255,.7); padding:6px 10px; border-radius:8px; backdrop-filter:blur(6px); z-index:50; }
  .lang-switch { position:fixed; top:14px; right:14px; z-index:50; background:rgba(255,255,255,.85); backdrop-filter:blur(6px); border:1px solid #e5e7eb; border-radius:10px; padding:4px; display:flex; gap:2px; font-size:12px; font-weight:600; }
  .lang-switch button { border:none; background:transparent; padding:5px 10px; border-radius:7px; color:#7a8aa1; cursor:pointer; font-weight:600; }
  .lang-switch button.on { background:#1f3a5f; color:#fff; }

  .phone { width:375px; height:812px; background:#fff; border-radius:48px; box-shadow: 0 30px 60px rgba(31,58,95,.25), 0 0 0 12px #1f2937, 0 0 0 14px #4b5563; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:160px; height:30px; background:#1f2937; border-radius:0 0 18px 18px; z-index:100; }
  .status-bar { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; font-size:13px; font-weight:600; color:#1f2937; }
  .screen { flex:1; overflow-y:auto; padding:14px 18px 80px; -webkit-overflow-scrolling:touch; }
  .screen::-webkit-scrollbar { display:none; }
  .tab-bar { position:absolute; bottom:0; left:0; right:0; height:74px; background:#fff; border-top:1px solid #e5e7eb; display:flex; padding-bottom:18px; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; color:#94a3b8; cursor:pointer; transition:color .2s; }
  .tab.active { color:#1f3a5f; }
  .tab svg { width:20px; height:20px; }
  .h-screen { font-size:22px; font-weight:800; letter-spacing:-.5px; color:#1f3a5f; margin:8px 0 4px; }
  .sub-screen { font-size:12px; color:#7a8aa1; margin-bottom:14px; }
  .card { background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%); border:1px solid #e5e7eb; border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:0 2px 6px rgba(31,58,95,.04); }
  .card h3 { font-size:13px; color:#7a8aa1; font-weight:600; margin-bottom:8px; letter-spacing:.3px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; margin:2px 4px 2px 0; }
  .badge.ok { background:#d1fae5; color:#065f46; }
  .badge.lock { background:#f1f5f9; color:#94a3b8; }
  .badge.gold { background:linear-gradient(135deg,#fef3c7,#fde68a); color:#92400e; }
  .badge.win { background:linear-gradient(135deg,#d1fae5,#a7f3d0); color:#065f46; }
  .badge.loss { background:linear-gradient(135deg,#fee2e2,#fecaca); color:#991b1b; }
  .badge.draw { background:linear-gradient(135deg,#e0e7ff,#c7d2fe); color:#3730a3; }
  .avatar-area { display:flex; align-items:center; gap:14px; padding:6px 4px; }
  .avatar { width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:38px; background:linear-gradient(135deg,#1f3a5f,#3b82f6); box-shadow:0 6px 14px rgba(31,58,95,.3); transition:all .4s; }
  .avatar.level-1 { background:linear-gradient(135deg,#94a3b8,#cbd5e1); }
  .avatar.level-2 { background:linear-gradient(135deg,#1e3a8a,#3b82f6); }
  .avatar.level-3 { background:linear-gradient(135deg,#7c3aed,#c084fc); }
  .avatar.level-4 { background:linear-gradient(135deg,#b45309,#fbbf24); }
  .avatar.level-5 { background:linear-gradient(135deg,#dc2626,#fbbf24); box-shadow:0 6px 20px rgba(220,38,38,.4); }
  .avatar-info { flex:1; }
  .avatar-info .name { font-size:15px; font-weight:700; color:#1f3a5f; }
  .avatar-info .title { font-size:11px; color:#7a8aa1; margin-top:2px; }
  .level-bar { height:6px; background:#e5e7eb; border-radius:3px; margin-top:8px; overflow:hidden; }
  .level-fill { height:100%; background:linear-gradient(90deg,#3b82f6,#fbbf24); border-radius:3px; transition:width .6s; }
  .stat-row { display:flex; gap:8px; margin-bottom:12px; }
  .stat { flex:1; background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:10px 6px; text-align:center; }
  .stat .v { font-size:18px; font-weight:800; color:#1f3a5f; }
  .stat .l { font-size:9.5px; color:#7a8aa1; margin-top:2px; letter-spacing:.3px; }
  .stat.energy .v { color:#dc2626; }
  .stat.mood .v { color:#7c3aed; }
  .stat.bat .v { color:#16a34a; }
  .stat.body .v { color:#0891b2; }
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:11px; color:#7a8aa1; margin-bottom:4px; font-weight:600; }
  .field input, .field select, .field textarea { width:100%; padding:9px 12px; border:1px solid #e5e7eb; border-radius:10px; font-size:14px; color:#1f3a5f; font-family:inherit; background:#fff; }
  .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:#3b82f6; }
  .field textarea { resize:none; height:54px; }
  .seg { display:flex; gap:6px; }
  .seg-item { flex:1; text-align:center; padding:7px 4px; border:1px solid #e5e7eb; border-radius:8px; font-size:12px; cursor:pointer; transition:all .2s; background:#fff; }
  .seg-item.on { background:#1f3a5f; color:#fff; border-color:#1f3a5f; }
  .btn { width:100%; padding:13px; background:linear-gradient(135deg,#1f3a5f,#3b82f6); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(31,58,95,.3); transition:transform .1s; }
  .btn:active { transform:scale(.98); }
  .btn.ghost { background:#f1f5f9; color:#1f3a5f; box-shadow:none; }
  .btn.warn { background:linear-gradient(135deg,#7c3aed,#c084fc); }
  .btn.mic { background:linear-gradient(135deg,#dc2626,#ef4444); box-shadow:0 4px 14px rgba(220,38,38,.4); }
  .btn.mic.recording { background:linear-gradient(135deg,#dc2626,#fbbf24); animation:pulse 1.2s ease-in-out infinite; }
  .btn.mic.mini { padding:6px 10px; font-size:11px; width:auto; }
  @keyframes pulse { 0%,100% { box-shadow:0 4px 14px rgba(220,38,38,.4);} 50%{box-shadow:0 4px 24px rgba(220,38,38,.8);} }
  .log-item { display:flex; gap:10px; padding:10px; border-radius:12px; margin-bottom:8px; background:#f8fafc; align-items:center; }
  .log-date { font-size:10px; color:#7a8aa1; min-width:46px; }
  .log-info { flex:1; }
  .log-info .top { font-size:13px; font-weight:700; color:#1f3a5f; }
  .log-info .bot { font-size:11px; color:#7a8aa1; margin-top:2px; }
  .log-speed { font-size:18px; font-weight:800; color:#dc2626; }
  .empty { text-align:center; padding:30px 10px; color:#94a3b8; font-size:12px; }
  .chart-wrap { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:12px; margin-bottom:10px; }
  .chart-title { font-size:12px; font-weight:700; color:#1f3a5f; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .legend { display:flex; gap:10px; font-size:10px; color:#7a8aa1; flex-wrap:wrap; }
  .lg-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
  .review-card { background:linear-gradient(135deg,#1f3a5f,#3b82f6); color:#fff; border-radius:16px; padding:16px; }
  .review-card h3 { color:#fff; font-size:14px; margin-bottom:10px; }
  .review-quote { font-size:13px; line-height:1.7; color:#e0e7ff; font-style:italic; }
  .toast { position:absolute; top:60px; left:50%; transform:translateX(-50%); background:rgba(31,58,95,.95); color:#fff; padding:10px 16px; border-radius:10px; font-size:12px; z-index:200; opacity:0; transition:opacity .3s; max-width:80%; text-align:center; }
  .toast.show { opacity:1; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .profile-row { display:flex; align-items:center; gap:10px; padding:6px 0; }
  .profile-row .lbl { font-size:12px; color:#7a8aa1; min-width:64px; }
  .pill { display:inline-block; padding:3px 8px; background:#dbeafe; color:#1e40af; border-radius:6px; font-size:11px; font-weight:600; margin-right:4px; }
  .section-title { font-size:11px; font-weight:700; color:#1f3a5f; letter-spacing:.5px; margin:14px 0 6px; text-transform:uppercase; }
  .delete-x { color:#ef4444; font-size:18px; cursor:pointer; padding:0 4px; line-height:1; }
  .loc-pill { display:inline-flex; align-items:center; gap:4px; background:#dbeafe; color:#1e40af; border-radius:999px; padding:3px 9px; font-size:11px; font-weight:600; margin-top:6px; }
  .loc-pill .x { color:#94a3b8; cursor:pointer; font-size:13px; }
  .src-pill { font-size:10px; padding:2px 6px; border-radius:6px; font-weight:600; }
  .src-pill.self { background:#dbeafe; color:#1e40af; }
  .src-pill.coach { background:#fef3c7; color:#92400e; }
  .src-pill.parent { background:#fce7f3; color:#9d174d; }
  .match-only { display:none; }
  .match-only.show { display:block; }

  /* 反思专用样式 */
  .reflect-q { background:#f8fafc; border:1px solid #e5e7eb; border-radius:12px; padding:10px; margin-bottom:10px; }
  .reflect-q .q-label { font-size:12px; font-weight:700; color:#1f3a5f; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .reflect-q textarea { font-size:13px; height:50px; }
  .reflect-item { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:10px; margin-bottom:8px; }
  .reflect-item .ri-head { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#7a8aa1; margin-bottom:6px; }
  .reflect-item .ri-row { font-size:12px; line-height:1.6; margin-bottom:4px; }
  .reflect-item .ri-row b { color:#1f3a5f; }
  .kw-cloud { display:flex; flex-wrap:wrap; gap:6px; }
  .kw { background:#fef3c7; color:#92400e; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .kw.keep { background:#d1fae5; color:#065f46; }
  .kw.improve { background:#fee2e2; color:#991b1b; }
  .kw.highlight { background:#dbeafe; color:#1e40af; }
  .kw .c { color:#7a8aa1; font-weight:400; margin-left:3px; font-size:10px; }

  /* ============ v6 新增：9宫格、弹层、球数预警 ============ */
  .pitch-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; max-width:280px; margin:8px auto; }
  .pitch-cell { aspect-ratio:1; border:1.5px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; color:#7a8aa1; font-weight:700; position:relative; transition:transform .1s; }
  .pitch-cell:active { transform:scale(.95); }
  .pitch-cell.strike { border-color:#16a34a; border-width:2px; background:#f0fdf4; }
  .pitch-cell.ball { border-color:#dc2626; border-width:2px; background:#fef2f2; }
  .pitch-cell.hit-strike { background:#16a34a; color:#fff; border-color:#16a34a; }
  .pitch-cell.hit-ball { background:#dc2626; color:#fff; border-color:#dc2626; }
  .pitch-cell .cnt { position:absolute; top:2px; right:3px; font-size:9px; background:rgba(255,255,255,.7); padding:0 3px; border-radius:3px; }
  .pitch-cell .pos { font-size:8px; color:#94a3b8; position:absolute; bottom:1px; left:3px; }
  .pitch-grid-caption { display:flex; justify-content:space-between; font-size:9px; color:#94a3b8; max-width:280px; margin:0 auto 2px; padding:0 4px; }
  .legend-9 { font-size:10px; color:#7a8aa1; text-align:center; margin-top:4px; max-width:280px; margin-left:auto; margin-right:auto; }

  /* 弹层 */
  .modal-mask { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:300; display:none; align-items:flex-end; justify-content:center; }
  .modal-mask.show { display:flex; }
  .modal-content { background:#fff; width:100%; border-radius:24px 24px 0 0; padding:18px; max-height:78%; overflow-y:auto; animation:slideUp .3s; }
  @keyframes slideUp { from { transform:translateY(100%);} to { transform:translateY(0);} }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-header h2 { font-size:17px; font-weight:800; color:#1f3a5f; }
  .modal-close { font-size:24px; color:#94a3b8; cursor:pointer; padding:0 4px; }
  .modal-stats { display:flex; gap:8px; margin-bottom:12px; }
  .modal-stat { flex:1; background:#f8fafc; border-radius:10px; padding:8px; text-align:center; }
  .modal-stat .v { font-size:18px; font-weight:800; color:#1f3a5f; }
  .modal-stat .l { font-size:10px; color:#7a8aa1; }

  /* 球数预警 */
  .warning-card { background:linear-gradient(135deg,#fee2e2,#fecaca); border-color:#dc2626; }
  .warning-card.ok { background:linear-gradient(135deg,#d1fae5,#a7f3d0); border-color:#16a34a; }
  .warning-card.mid { background:linear-gradient(135deg,#fef3c7,#fde68a); border-color:#f59e0b; }
  .warning-bar { height:8px; background:#fff; border-radius:4px; overflow:hidden; margin-top:6px; }
  .warning-bar .fill { height:100%; background:linear-gradient(90deg,#16a34a,#fbbf24,#dc2626); transition:width .4s; }

  /* CSV 预览表格 */
  .csv-preview { background:#0f172a; color:#e2e8f0; border-radius:10px; padding:10px; font-family:Menlo,Monaco,monospace; font-size:10px; max-height:200px; overflow:auto; margin-top:8px; line-height:1.5; }
  .csv-preview .ok { color:#4ade80; }
  .csv-preview .err { color:#f87171; }

  /* 设备数据 logo 标签 */
  .device-pill { display:inline-flex; align-items:center; gap:4px; background:#fce7f3; color:#9d174d; border-radius:999px; padding:3px 9px; font-size:10px; font-weight:700; }

  @media print {
    body { background:#fff; padding:0; display:block; }
    .desktop-hint, .lang-switch, .phone, .tab-bar, .toast { display:none !important; }
    #printReport { display:block !important; }
    @page { size:A4; margin:14mm; }
  }
  #printReport { display:none; padding:0; color:#1f2937; }
  #printReport h1 { font-size:26px; color:#1f3a5f; margin-bottom:4px; }
  #printReport .sub { color:#64748b; font-size:12px; margin-bottom:18px; }
  #printReport .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  #printReport .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
  #printReport .box { border:1px solid #e5e7eb; border-radius:10px; padding:12px; background:#f8fafc; }
  #printReport .box .lbl { font-size:11px; color:#64748b; }
  #printReport .box .v { font-size:22px; font-weight:800; color:#1f3a5f; margin-top:2px; }
  #printReport h2 { font-size:14px; color:#1f3a5f; margin:14px 0 6px; border-bottom:2px solid #1f3a5f; padding-bottom:4px; }
  #printReport table { width:100%; border-collapse:collapse; font-size:11px; margin-bottom:10px; }
  #printReport th { background:#1f3a5f; color:#fff; padding:6px 8px; text-align:left; }
  #printReport td { padding:5px 8px; border-bottom:1px solid #e5e7eb; }
  #printReport .footer { margin-top:18px; font-size:10px; color:#94a3b8; text-align:center; border-top:1px solid #e5e7eb; padding-top:8px; }
  #printReport svg { width:100%; height:auto; }

  /* v7 AI Coach modal */
  #aiModal { position:fixed; inset:0; background:#0f172a; z-index:9999; overflow-y:auto; display:none; color:#f1f5f9; font-size:13px; }
  #aiModal.show { display:block; }
  #aiModal .top-bar { position:sticky; top:0; background:#1e293b; padding:14px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #334155; z-index:10; }
  #aiModal .top-bar h3 { margin:0; flex:1; font-size:15px; }
  #aiModal .x-btn { width:32px; height:32px; border-radius:50%; background:#ef4444; color:white; border:none; font-size:14px; cursor:pointer; }
  #aiModal .step-area { padding:20px 16px; }
  #aiModal .step-card { background:#1e293b; border-radius:12px; padding:18px; margin-bottom:14px; border:1px solid #334155; }
  #aiModal .step-num { display:inline-block; background:#fbbf24; color:#1e1b4b; font-weight:700; padding:3px 10px; border-radius:20px; font-size:11px; margin-bottom:10px; }
  #aiModal .opt-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  #aiModal .opt-btn { background:#334155; border:2px solid #475569; padding:18px 12px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; color:#f1f5f9; }
  #aiModal .opt-btn:hover { border-color:#fbbf24; background:#475569; }
  #aiModal .opt-btn.sel { border-color:#fbbf24; background:#fbbf24; color:#1e1b4b; }
  #aiModal .vid-wrap { position:relative; background:black; border-radius:10px; overflow:hidden; aspect-ratio:4/3; max-width:480px; margin:10px auto; }
  #aiModal .vid-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
  #aiModal .vid-wrap canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #aiModal .rec-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#ef4444; margin-right:6px; animation:aiBlink 1s infinite; }
  @keyframes aiBlink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  #aiModal .progress { height:6px; background:#334155; border-radius:3px; overflow:hidden; margin:10px 0; }
  #aiModal .progress-bar { height:100%; background:linear-gradient(90deg,#fbbf24,#f59e0b); width:0%; transition:width 0.3s; }
  #aiModal .frame-strip { display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:6px; margin:10px 0; }
  #aiModal .frame-strip canvas { width:100%; aspect-ratio:4/3; border-radius:6px; background:#000; object-fit:cover; }
  #aiModal .angle-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
  #aiModal .angle-card { background:#0f172a; border-radius:8px; padding:10px; border:1px solid #334155; }
  #aiModal .angle-card .lbl { font-size:10px; color:#94a3b8; margin-bottom:3px; }
  #aiModal .angle-card .val { font-size:18px; font-weight:700; color:#fbbf24; }
  #aiModal .angle-card .sub { font-size:10px; color:#64748b; margin-top:2px; }
  #aiModal .ai-report { background:linear-gradient(135deg,#1e293b,#0f172a); border-radius:12px; padding:18px; margin:10px 0; border:2px solid #fbbf24; }
  #aiModal .ai-report h4 { margin:0 0 8px 0; color:#fbbf24; font-size:13px; }
  #aiModal .ai-report .problem { color:#fca5a5; font-size:13px; line-height:1.6; margin-bottom:12px; padding:10px; background:#7f1d1d40; border-radius:8px; }
  #aiModal .ai-report .tip-row { color:#cbd5e1; font-size:12px; line-height:1.6; margin:6px 0; padding-left:8px; border-left:2px solid #fbbf24; }
  #aiModal .ai-report .encourage { color:#fef3c7; font-style:italic; font-size:13px; margin-top:12px; padding-top:10px; border-top:1px solid #475569; }
  #aiModal .ai-report .score { display:inline-block; background:#fbbf24; color:#1e1b4b; font-weight:700; padding:4px 14px; border-radius:20px; font-size:18px; }
  #aiModal .pill { display:inline-block; padding:3px 10px; background:#334155; border-radius:12px; font-size:11px; margin-right:4px; }
  #aiModal .pill.warn { background:#7c2d12; color:#fed7aa; }
  #aiModal .pill.ok { background:#14532d; color:#bbf7d0; }
  #aiModal .err { color:#fca5a5; padding:10px; background:#7f1d1d40; border-radius:8px; margin:10px 0; }
</style>
</head>
<body>
<div class="desktop-hint">💡 数据自动保存到本机 · 在 Mac/iPhone 打开体验最佳</div>
<div class="lang-switch">
  <button id="langZh" class="on" onclick="setLang('zh')">中</button>
  <button id="langEn" onclick="setLang('en')">EN</button>
</div>

<div class="phone">
  <div class="notch"></div>
  <div class="status-bar">
    <span id="clk">9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="screen" id="screen"></div>

  <div class="tab-bar">
    <div class="tab active" data-tab="home" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12L12 3l9 9M5 10v10h14V10"/></svg>

function avgMood() { if (!DATA.logs.length) return 0; return DATA.logs.slice(-5).reduce((s,l)=>s+l.mood,0) / Math.min(5,DATA.logs.length); }
function calcAge(birth) { if (!birth) return null; const b = new Date(birth); const now = new Date(); let age = now.getFullYear() - b.getFullYear(); const m = now.getMonth() - b.getMonth(); if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--; return age; }
function calcBatting(hits, atBats) { if (!atBats || atBats === 0) return null; return +(hits / atBats).toFixed(3); }
function fmtBat(avg) { if (avg == null) return '—'; return avg.toFixed(3).replace(/^0+/, '') || '.000'; }
function latestBody() { if (!DATA.bodyLogs.length) return null; return [...DATA.bodyLogs].sort((a,b)=>a.date.localeCompare(b.date)).pop(); }
function calcBMI(h, w) { if (!h || !w) return null; return +(w / Math.pow(h/100, 2)).toFixed(1); }
function fmtLoc(loc) { if (!loc) return ''; if (loc.name) return loc.name; return loc.lat.toFixed(4)+', '+loc.lng.toFixed(4); }

function weeklyPitchLimit(age) {
  if (!age) return 800;       // 默认 12 岁
  if (age <= 8) return 400;
  if (age <= 12) return 800;
  if (age <= 15) return 1100;
  return 1300;
}
function getWeekStart(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay() || 7;     // 周一为第一天
  d.setDate(d.getDate() - day + 1);
  return d.toISOString().slice(0,10);
}
function pitchesThisWeek() {
  // v8.5：总投球数 = 一周内训练/比赛日志中的 pitchCount 加总（不论来源：手动记 / 投球快计自动 / CSV 都算）
  if (!DATA.logs || !DATA.logs.length) return 0;
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  const monday = getWeekStart(today);
  return DATA.logs
    .filter(l => l.date >= monday && l.date <= today)

function savePitchSession() {
  if (!pitchSession.entries.length) { toast(LANG==='zh'?'没有投球可保存':'No pitches to save'); return; }
  const today = new Date().toISOString().slice(0,10);
  // 1) 写单球 → DATA.pitches[]（驱动 9 宫格热点图 + AI 战术分析）
  const newRows = pitchSession.entries.map(e => ({ date: today, speed: e.speed, location: e.location, isStrike: e.isStrike, source:'self' }));
  DATA.pitches.push(...newRows);
  // 2) 同步建一条训练日志 → DATA.logs[]（驱动总投球数 + 训练趋势）
  const n = newRows.length;
  const s = newRows.filter(r => r.isStrike).length;
  const pct = n ? Math.round(s / n * 100) : 0;
  const avgSpeed = Math.round(newRows.reduce((a, r) => a + r.speed, 0) / n);
  const hitsAllowed = document.getElementById('pm_pitcherHits').value;
  const soThrown = document.getElementById('pm_pitcherSO').value;
  const logEntry = {
    id: Date.now(),
    date: today,
    type: 'train',
    source: 'self',
    pitchCount: n,
    strike: pct,
    speed: avgSpeed,
    mood: 4,
    note: '⚾ 投球快计自动记录'
  };
  // 可空字段：有填才写入
  if (hitsAllowed !== '') logEntry.hits = +hitsAllowed;        // 投手被安打数（与莀安本人安打共用 hits 字段）
  if (soThrown !== '') logEntry.pitcherSO = +soThrown;          // 投手投出三振（独立字段，避免与日志 strikeout 混淆）
  if (hitsAllowed !== '' || soThrown !== '') logEntry.note += ` · 被安打 ${hitsAllowed || 0} · 投出三振 ${soThrown || 0}`;
  DATA.logs.push(logEntry);
  saveData(DATA);
  toast(`✓ ${LANG==='zh'?'已记录为训练':'Saved as training'} · ${n} ${LANG==='zh'?'球':'p'}`);
  closeModal('pitchModal');
  render();
}

// ============ v6 CSV 解析 ============
const RAPSODO_FIELDS = {
  'pitch_id':'id', 'date':'date', 'time':'time',
  'speed_mph':'speedMph', 'velocity_mph':'speedMph', 'speed':'speedMph', 'velocity':'speedMph',
  'spin_rate':'spinRate', 'spin_rpm':'spinRate', 'rpm':'spinRate',
  'break':'breakIn', 'break_in':'breakIn', 'horizontal_break':'breakIn',
  'strike':'isStrike', 'result':'isStrike', 'is_strike':'isStrike',
  'location_x':'locX', 'location_y':'locY'
};
const BLAST_FIELDS = {
  'swing_speed':'swingSpeed', 'exit_velocity':'exitV', 'launch_angle':'launchAngle',
  'attack_angle':'attackAngle', 'date':'date', 'time':'time'
};
function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if (lines.length < 2) return { headers:[], rows:[], preview:[], format:'unknown' };
  const headers = lines[0].split(',').map(s=>s.trim().toLowerCase().replace(/[^a-z0-9_]/g,''));
  const isRapsodo = headers.includes('speed_mph') || headers.includes('spin_rate') || headers.includes('rpm');
  const isBlast = headers.includes('swing_speed') || headers.includes('exit_velocity');
  const format = isRapsodo ? 'rapsodo' : (isBlast ? 'blast' : 'unknown');
  const fieldMap = isRapsodo ? RAPSODO_FIELDS : (isBlast ? BLAST_FIELDS : {});
  const rows = [];
  for (let i=1;i<lines.length;i++) {
    const cols = lines[i].split(',').map(s=>s.trim());
    const row = {};
    headers.forEach((h, j) => {
      const key = fieldMap[h] || h;
      const v = cols[j];
      if (v == null) return;
      if (key === 'speedMph' || key === 'spinRate' || key === 'breakIn' || key === 'swingSpeed' || key === 'exitV') row[key] = parseFloat(v);
      else if (key === 'isStrike') row[key] = ['1','true','y','yes','strike','k'].includes(v.toLowerCase());
      else row[key] = v;
    });
    row.__date = row.date || (i<10 ? '2026-09-04' : '');  // 兜底日期
    row.__source = format;
    if (!row.speedMph && !row.swingSpeed) continue;   // 跳过无速度行
    rows.push(row);
  }
  // 速度转 km/h（mph × 1.60934）
  rows.forEach(r => { if (r.speedMph) r.speed = +(r.speedMph * 1.60934).toFixed(1); });
  const preview = rows.slice(0,8).map(r => {
    const parts = [];
    parts.push(`${r.__date||'-'}`);
    if (r.time) parts.push(r.time);
    if (r.speed) parts.push(`${r.speed} km/h`);
    if (r.spinRate) parts.push(`spin ${r.spinRate}`);
    if (r.breakIn!=null) parts.push(`break ${r.breakIn}in`);
    if (r.swingSpeed) parts.push(`swing ${r.swingSpeed}`);
    if (r.exitV) parts.push(`exit ${r.exitV}`);
    if (r.isStrike!=null) parts.push(r.isStrike?'⚾K':'○B');
    return parts.join(' · ');
  });
  return { headers, rows, preview, format, total: rows.length };
}

// 语音识别（按 field name 区分）
let recog = null;
let isRecording = false;
let voiceField = null;
function startVoice(field) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast(t('mic_no')); return; }
  if (isRecording) { stopVoice(); return; }
  voiceField = field;
  recog = new SR();
  recog.lang = LANG==='zh' ? 'zh-HK' : 'en-US';
  recog.interimResults = true;
  recog.continuous = false;
  let finalText = '';
  recog.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const txt = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += txt;
      else interim += txt;
    }
    const ta = document.getElementById('f_'+voiceField);
    if (ta) ta.value = (ta.value || '') + (finalText + interim);
  };
  recog.onerror = (e) => {
    console.warn('recog err', e);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast(t('mic_deny'));
    isRecording = false; updateMicBtn(voiceField);
  };
  recog.onend = () => {
    isRecording = false; updateMicBtn(voiceField);
    if (finalText) {
      if (voiceField === 'note') form.note = document.getElementById('f_note').value;
      else reflectForm[voiceField] = document.getElementById('f_'+voiceField).value;
      saveData(DATA);
      toast(t('mic_done'));
    }
    voiceField = null;
  };
  try { recog.start(); isRecording = true; updateMicBtn(field); } catch (e) { toast(t('mic_deny')); }
}
function stopVoice() { try { recog && recog.stop(); } catch(e){} isRecording = false; updateMicBtn(voiceField); }
function updateMicBtn(field) {
  document.querySelectorAll('.btn.mic.mini').forEach(b => b.classList.remove('recording'));
  if (!field) return;
  const b = document.getElementById('mic_'+field);
  if (!b) return;
  if (isRecording && voiceField === field) { b.classList.add('recording'); b.textContent = t('mic_rec'); }
  else { b.classList.remove('recording'); b.textContent = t('mic_idle'); }
}

function saveLog() {
  if (!form.date) { toast(t('date')); return; }
  // v8.5：去掉空字段的默认值 0，让数据为真"可空"保存进 DATA.logs
  const cleaned = { id: Date.now() };
  ['date','type','source','note','location','opponent','result','venue'].forEach(k => cleaned[k] = form[k]);
  ['speed','strike','mood','pitchCount','strikeout','hits','atBats','struckOut','scoreSelf','scoreOpp','pitcherSO','pitcherHits'].forEach(k => {
    if (form[k] !== null && form[k] !== '' && !Number.isNaN(form[k])) cleaned[k] = form[k];
  });
  DATA.logs.push(cleaned);
  saveData(DATA);
  form = { date: new Date().toISOString().slice(0,10), type: form.type, source: form.source, speed:null, strike:null, mood:4, pitchCount:null, strikeout:null, hits:null, atBats:null, struckOut:null, note:'', location:null, opponent:'', scoreSelf:null, scoreOpp:null, result:'', venue:'' };
  toast('✓ '+(LANG==='zh'?'已记录为训练/比赛':'Saved as train/match')); render();
}

// v6 9宫格热点图（5x5 grid，捕手视角）
function renderHeatmap9() {
  const el = document.getElementById('heatmap9');
  if (!el) return;
  if (!DATA.pitches || !DATA.pitches.length) {
    el.innerHTML = `<div class="empty">${t('c_need9')}</div>`;
    return;
  }
  // 统计
  const counts = { strike:{}, ball:{} };
  DATA.pitches.forEach(p => {
    const k = p.isStrike ? 'strike' : 'ball';
    counts[k][p.location] = (counts[k][p.location]||0) + 1;
  });
  const maxStrike = Math.max(1, ...Object.values(counts.strike));
  const maxBall = Math.max(1, ...Object.values(counts.ball));
  const grid = document.createElement('div');
  grid.className = 'pitch-grid';
  for (let i=0; i<25; i++) {
    const cell = document.createElement('div');
    const isS = isStrike(i);
    const cnt = isS ? (counts.strike[i]||0) : (counts.ball[i]||0);
    cell.className = 'pitch-cell ' + (isS ? 'strike' : 'ball');
    if (cnt > 0) {
      cell.classList.add('hit-' + (isS?'strike':'ball'));
      // 半透明：让频次不同产生深浅
      const ratio = isS ? cnt/maxStrike : cnt/maxBall;
      cell.style.opacity = 0.5 + 0.5*ratio;
    } else {
      cell.style.opacity = 0.4;
    }
    cell.innerHTML = `<span class="cnt">${cnt||''}</span><span class="pos">${i+1}</span>`;
    grid.appendChild(cell);
  }
  el.innerHTML = '';
  el.appendChild(grid);
  // caption
  const cap = document.createElement('div');
  cap.className = 'legend-9';
  const totS = Object.values(counts.strike).reduce((s,n)=>s+n,0);
  const totB = Object.values(counts.ball).reduce((s,n)=>s+n,0);
  cap.innerHTML = `${LANG==='zh'?'好球':'Strike'} <b style="color:#16a34a">${totS}</b> · ${LANG==='zh'?'坏球':'Ball'} <b style="color:#dc2626">${totB}</b> · ${LANG==='zh'?'命中率':'Hit %'} <b>${totS+totB?Math.round(totS/(totS+totB)*100):0}%</b>`;
  el.appendChild(cap);
}

// v6 设备数据曲线（按设备聚合）
function renderDeviceChart() {
  const data = DATA.deviceLogs || [];
  if (data.length < 1) return '';
  const W=320, H=180, pad=30;
  const x = i => data.length===1 ? W/2 : pad + (W-2*pad) * (i/(data.length-1));
  let g = '';
  for (let i=0;i<=4;i++) { const y=pad+(H-2*pad)*i/4; g += `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#e5e7eb" stroke-width=".5"/>`; }
  // 转速
  const spins = data.filter(d=>d.spinRate).map(d=>d.spinRate);
  if (spins.length >= 2) {
    const maxS = Math.max(...spins), minS = Math.min(...spins);
    const yS = v => H-pad-(H-2*pad)*((v-minS)/(maxS-minS||1));
    const pts = data.map((d,i)=> d.spinRate ? `${x(i)},${yS(d.spinRate)}` : null).filter(p=>p).join(' ');
    if (pts) g += `<polyline points="${pts}" fill="none" stroke="#dc2626" stroke-width="2"/>`;
    data.forEach((d,i)=>{ if (d.spinRate) g += `<circle cx="${x(i)}" cy="${yS(d.spinRate)}" r="3" fill="#dc2626"/>`; });
  }
  // 偏移
  const breaks = data.filter(d=>d.break!=null).map(d=>d.break);
  if (breaks.length >= 2) {
    const maxB = Math.max(...breaks, 0), minB = Math.min(...breaks, 0);
    const yB = v => H-pad-(H-2*pad)*((v-minB)/(maxB-minB||1));
    const pts = data.map((d,i)=> d.break!=null ? `${x(i)},${yB(d.break)}` : null).filter(p=>p).join(' ');
    if (pts) g += `<polyline points="${pts}" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="3 3"/>`;
    data.forEach((d,i)=>{ if (d.break!=null) g += `<circle cx="${x(i)}" cy="${yB(d.break)}" r="3" fill="#0891b2"/>`; });
  }
  return g;
}

function renderSvgChart(mode) {
  const data = DATA.logs;
  if (data.length < 2) return `<text x="160" y="100" text-anchor="middle" fill="#94a3b8" font-size="13">${t('c_need2')}</text>`;
  const W=320, H=200, pad=30;
  const x = i => pad + (W-2*pad) * (i/(data.length-1));
  let g = '';
  for (let i=0;i<=4;i++) { const y=pad+(H-2*pad)*i/4; g += `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#e5e7eb" stroke-width=".5"/>`; }
  if (mode==='dual') {
    const maxS=Math.max(...data.map(l=>l.speed),85), minS=Math.min(...data.map(l=>l.speed),75);
    const yS=v=>H-pad-(H-2*pad)*((v-minS)/(maxS-minS||1));
    const yM=v=>H-pad-(H-2*pad)*((v-1)/4);
    g += `<polyline points="${data.map((l,i)=>`${x(i)},${yS(l.speed)}`).join(' ')}" fill="none" stroke="#dc2626" stroke-width="2.5"/>`;
    data.forEach((l,i)=>{ g += `<circle cx="${x(i)}" cy="${yS(l.speed)}" r="4" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="${x(i)}" y="${yS(l.speed)-8}" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">${l.speed}</text>`; });
    g += `<polyline points="${data.map((l,i)=>`${x(i)},${yM(l.mood*1.8)}`).join(' ')}" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4 3"/>`;
    data.forEach((l,i)=>{ g += `<circle cx="${x(i)}" cy="${yM(l.mood*1.8)}" r="3.5" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/>`; });
  } else if (mode==='bat') {
    const bats = data.map(l=>calcBatting(l.hits,l.atBats));
    const maxB = Math.max(...bats.filter(b=>b!=null),0.5);
    const minB = 0;
    const yB = v => v==null ? null : H-pad-(H-2*pad)*((v-minB)/(maxB-minB||1));
    const maxP = Math.max(...data.map(l=>l.pitchCount||0),100);
    const yP = v => H-pad-(H-2*pad)*(v/maxP);
    const batPts = data.map((l,i)=>{ const v=yB(calcBatting(l.hits,l.atBats)); return v==null?null:`${x(i)},${v}`; }).filter(p=>p).join(' ');
    if (batPts) g += `<polyline points="${batPts}" fill="none" stroke="#16a34a" stroke-width="2.5"/>`;
    data.forEach((l,i)=>{ const v=yB(calcBatting(l.hits,l.atBats)); if (v!=null) g += `<circle cx="${x(i)}" cy="${v}" r="4" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>`; });
    g += `<polyline points="${data.map((l,i)=>`${x(i)},${yP(l.pitchCount||0)}`).join(' ')}" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="3 3"/>`;
    data.forEach((l,i)=>{ g += `<circle cx="${x(i)}" cy="${yP(l.pitchCount||0)}" r="3.5" fill="#0891b2" stroke="#fff" stroke-width="1.5"/>`; });
  }
  data.forEach((l,i)=>{ g += `<text x="${x(i)}" y="${H-pad+14}" text-anchor="middle" font-size="8" fill="#7a8aa1">${l.date.slice(5)}</text>`; });
  return g;
}

function renderSOChart() {
  const data = DATA.logs;

  const W=320, H=180, pad=30;
  const x = i => data.length===1 ? W/2 : pad + (W-2*pad) * (i/(data.length-1));
  let g = '';
  for (let i=0;i<=4;i++) { const y=pad+(H-2*pad)*i/4; g += `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#e5e7eb" stroke-width=".5"/>`; }
  const maxSO = Math.max(...data.map(l=>l.strikeout||0), 5);
  const ySO = v => H-pad-(H-2*pad)*(v/maxSO);
  const barW = Math.max(6, (W-2*pad)/data.length * 0.6);
  data.forEach((l,i)=>{
    const v = l.strikeout||0;
    if (v>0) {
      g += `<rect x="${x(i)-barW/2}" y="${ySO(v)}" width="${barW}" height="${H-pad-ySO(v)}" fill="#dc2626" opacity=".7" rx="2"/>`;
      g += `<text x="${x(i)}" y="${ySO(v)-4}" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">${v}</text>`;
    }
  });
  data.forEach((l,i)=>{ g += `<text x="${x(i)}" y="${H-pad+14}" text-anchor="middle" font-size="8" fill="#7a8aa1">${l.date.slice(5)}</text>`; });
  return g;
}

// ========== 反思模块 ==========
function reflectKeywordSummary() {
  const recent = DATA.reflections.slice(-10);
  if (recent.length < 3) return null;
  const stopWords = new Set(['的','了','是','我','你','他','要','在','和','与','也','有','会','能','到','要','去','做','对','比','上','下','中','还','就','把','被','让','但','又','或','一','二','三']);
  function tokenize(text) {
    if (!text) return [];
    const words = [];
    const cn = text.match(/[\u4e00-\u9fa5]+/g) || [];
    cn.forEach(seg => {
      for (let i=0; i<seg.length-1; i++) {
        const w = seg.slice(i, i+2);
        if (!stopWords.has(w)) words.push(w);
      }
    });
    const en = text.match(/[a-zA-Z]+/g) || [];
    en.forEach(w => { if (w.length>2) words.push(w.toLowerCase()); });
    return words;
  }
  const buckets = { keep: {}, improve: {}, highlight: {} };
  recent.forEach(r => {
    ['keep','improve','highlight'].forEach(k => {
      tokenize(r[k]).forEach(w => {
        buckets[k][w] = (buckets[k][w] || 0) + 1;
      });
    });
  });
  function topN(obj, n=5) {
    return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n).filter(e=>e[1]>=2);
  }
  return {
    keep: topN(buckets.keep),
    improve: topN(buckets.improve),
    highlight: topN(buckets.highlight)
  };
}

function saveReflection() {
  if (!reflectForm.keep && !reflectForm.improve && !reflectForm.highlight) {
    toast(LANG==='zh'?'三问至少填一题':'Fill at least one');
    return;
  }
  DATA.reflections.push({id: Date.now(), ...reflectForm});
  saveData(DATA);
  reflectForm = { date: new Date().toISOString().slice(0,10), type:'train', keep:'', improve:'', highlight:'', source:'self' };
  toast('✓ '+(LANG==='zh'?'反思已保存':'Saved')); render();
}

function deleteReflection(id) {
  if (!confirm(t('yes')+'?')) return;
  DATA.reflections = DATA.reflections.filter(r => r.id != id);
  saveData(DATA); render();
}

const MP_LIB = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const MP_WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task';

const AI = { state: 'idle', action: null, videoUrl: null, frames: null, angles: null, landmarker: null };
let _aiStream = null, _aiRecorder = null, _aiChunks = [];

async function ensureLandmarker() {
  if (AI.landmarker) return AI.landmarker;
  const m = await import(MP_LIB);
  const vision = await m.FilesetResolver.forVisionTasks(MP_WASM);
  AI.landmarker = await m.PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: MP_MODEL, delegate: 'GPU' },
    runningMode: 'VIDEO', numPoses: 1,
    minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5
  });
  return AI.landmarker;
}

  AI.state = 'choose-action';

  renderAIStep();
}

function closeAICoach() {
  if (AI.videoUrl) { URL.revokeObjectURL(AI.videoUrl); AI.videoUrl = null; }
  stopAISteam();
  AI.state = 'idle';
  document.getElementById('aiModal').classList.remove('show');
}

function pickFromAlbum(file) {
  if (!file) return;
  if (AI.videoUrl) URL.revokeObjectURL(AI.videoUrl);

  if (_aiStream) { _aiStream.getTracks().forEach(t => t.stop()); _aiStream = null; }
  if (_aiRecorder && _aiRecorder.state !== 'inactive') { try { _aiRecorder.stop(); } catch(e){} }
}

function renderAIStep() {
  const r = document.getElementById('aiRoot');
  r.innerHTML = '';
  switch(AI.state) {
    case 'choose-action': r.innerHTML = step1HTML(); bindStep1(); break;
    case 'choose-source': r.innerHTML = step2HTML(); bindStep2(); break;
    case 'recording': r.innerHTML = recordingHTML(); startRecording(); break;
    case 'loading-video': r.innerHTML = loadingHTML(); bindLoading(); break;
    case 'analyzing': r.innerHTML = analyzingHTML(); runAnalysis().catch(e=>{document.getElementById('aiLoadText').textContent='❌ '+e.message;}); break;
    case 'ai-eval': r.innerHTML = aiEvalHTML(); runAIEval(); break;
    case 'result': r.innerHTML = resultHTML(); bindResult(); break;
  }
}

function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast(t('ai_err_camera')+'no mediaDevices'); AI.state='choose-source'; renderAIStep(); return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}, audio:false})
    .then(stream => {
      _aiStream = stream;
      const v = document.getElementById('aiRecVid');
      v.srcObject = stream; v.muted = true; v.play();
      _aiChunks = [];
      _aiRecorder = new MediaRecorder(stream, {mimeType:'video/webm'});
      _aiRecorder.ondataavailable = e => { if (e.data.size) _aiChunks.push(e.data); };
      _aiRecorder.onstop = () => {
        const blob = new Blob(_aiChunks, {type:'video/webm'});
        if (AI.videoUrl) URL.revokeObjectURL(AI.videoUrl);
        AI.videoUrl = URL.createObjectURL(blob);
        stopAISteam();
        AI.state = 'loading-video';
        renderAIStep();
      };
      _aiRecorder.start();
      let n = 3;
      const cd = document.getElementById('aiCountdown');
      const tick = () => {
        n--;
        if (cd) cd.textContent = n;
        if (n > 0) setTimeout(tick, 1000);
      };
      setTimeout(tick, 1000);
      setTimeout(() => { if (_aiRecorder && _aiRecorder.state==='recording') _aiRecorder.stop(); }, 3100);
    })
    .catch(err => {
      toast(t('ai_err_camera')+err.message);
      AI.state='choose-source';
      renderAIStep();
    });
}

async function runAnalysis() {
  setProg(5, t('ai_load_video'));

  await new Promise(r => v.addEventListener('loadedmetadata', r, {once:true}));

  setProg(15, t('ai_load_model'));
  await ensureLandmarker();
  setProg(35, t('ai_extract'));
  const N = Math.min(20, Math.max(8, Math.floor(v.duration*8)));
  // 在静音视频上抓帧
  const canvas = document.createElement('canvas');
  canvas.width = v.videoWidth; canvas.height = v.videoHeight;
  const ctx = canvas.getContext('2d');
  AI.frames = [];
  for (let i=0; i<N; i++) {

    ctx.drawImage(v, 0, 0);

  }
  // 抽帧渲染到 strip
  const strip = document.getElementById('aiStrip');
  if (strip) {
    strip.innerHTML = AI.frames.map(f => `<img src="${f.dataUrl}"/>`).join('');
  }
  setProg(65, t('ai_pose_detect'));
  // MediaPipe 跑每帧（在原始 video 元素上）
  const poses = [];
  const landmarksByFrame = [];
  for (let i=0; i<N; i++) {
    const tt = (i+0.5)/N * v.duration;
    await seekVideo(v, tt);
    const result = AI.landmarker.detectForVideo(v, tt*1000);
    const lm = result.landmarks[0] || null;
    poses.push(lm);
    landmarksByFrame.push({ t: tt, landmarks: lm, idx: i });
    if (AI.frames[i]) AI.frames[i].landmarks = lm;
    setProg(65 + 25*i/N, `${t('ai_pose_detect')} ${i+1}/${N}`);
  }
  setProg(92, t('ai_calc_angle'));
  AI.angles = poseSeriesToAngles(poses);
  AI.fallbackEval = mockCoachEval(AI.angles);
  AI.feedback = AI.fallbackEval;
  AI.feedbackSource = 'mock';
  setProg(100, '✓');
  await new Promise(r => setTimeout(r, 350));
  // v8.4：抽取关键帧姿态叠图（异步、不阻塞）
  buildOverlayFrames().then(ov => {
    AI.overlayKey = ov.keyDataUrl;
    AI.overlayStrip = ov.stripDataUrls;
    AI.overlayKeyIdx = ov.keyIdx;
  });
  if (LLM.enabled && LLM.apiKey) {
    AI.state = 'ai-eval';
  } else {
    AI.state = 'result';
  }
  renderAIStep();
}

function seekVideo(v, t) {
  return new Promise(resolve => {
    const onSeek = () => { v.removeEventListener('seeked', onSeek); resolve(); };
    v.addEventListener('seeked', onSeek);
    v.currentTime = t;
    setTimeout(resolve, 1500);
  });
}

function poseSeriesToAngles(poses) {
  function mid(a,b){return {x:(a.x+b.x)/2, y:(a.y+b.y)/2};}
  function ang(a, b, c) {
    if (!a || !b || !c) return null;
    const v1x = a.x-b.x, v1y = a.y-b.y;
    const v2x = c.x-b.x, v2y = c.y-b.y;
    const dot = v1x*v2x + v1y*v2y;
    const m1 = Math.hypot(v1x,v1y), m2 = Math.hypot(v2x,v2y);
    if (!m1||!m2) return null;
    return Math.acos(Math.max(-1,Math.min(1, dot/(m1*m2)))) * 180/Math.PI;
  }
  function seg(a,b){return Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI;}
  return poses.map(lm => {
    if (!lm || lm.length < 25) return null;
    const sh = lm[11], el = lm[13], wr = lm[15];
    const rsh = lm[12], hp = lm[23], rhp = lm[24];
    const elbowAngle = ang(sh, el, wr);
    const shLine = sh && rsh ? seg(sh, rsh) : null;
    const hpLine = hp && rhp ? seg(hp, rhp) : null;
    const hipShoulderSep = (shLine!=null && hpLine!=null) ? Math.abs(shLine - hpLine) : null;
    const sm = (sh && rsh) ? mid(sh, rsh) : null;
    const hm = (hp && rhp) ? mid(hp, rhp) : null;
    const trunkTilt = (sm && hm) ? Math.abs(Math.atan2(sm.x-hm.x, sm.y-hm.y) * 180/Math.PI) : null;
    return { elbow: elbowAngle, hipShoulder: hipShoulderSep, trunkTilt, stance: 0 };
  });
}

// ===== v8.4 姿态叠图：在原图上画骨架 + 角度标签，返回新图 dataURL =====
const POSE_CONNECTIONS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],
  [23,25],[25,27],[24,26],[26,28],
  [27,29],[29,31],[28,30],[30,32],
  [15,17],[15,19],[15,21],[16,18],[16,20],[16,22]
];
function drawPoseOverlay(frame, idx, angle, isKey) {
  return new Promise(resolve => {
    if (!frame || !frame.dataUrl) { resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      const W = img.width, H = img.height;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0, W, H);
      const lm = frame.landmarks;
      if (lm && lm.length >= 25) {
        // 骨架线
        cx.strokeStyle = isKey ? '#fbbf24' : '#a855f7';
        cx.lineWidth = isKey ? 5 : 3;
        POSE_CONNECTIONS.forEach(([a,b]) => {
          if (!lm[a] || !lm[b]) return;
          cx.beginPath();
          cx.moveTo(lm[a].x*W, lm[a].y*H);
          cx.lineTo(lm[b].x*W, lm[b].y*H);
          cx.stroke();
        });
        // 关节点
        cx.fillStyle = '#fff';
        [11,12,13,15,14,16,23,24,25,26,27,28].forEach(p => {
          if (!lm[p] || (lm[p].visibility !== undefined && lm[p].visibility < 0.5)) return;
          cx.beginPath();
          cx.arc(lm[p].x*W, lm[p].y*H, isKey?6:4, 0, Math.PI*2);
          cx.fill();
        });
        // 关键帧加重 — 标注角度
        if (isKey && angle) {
          const drawLabel = (text, p, bg='#fbbf24', fg='#1e1b4b') => {
            if (!lm[p]) return;
            const x = lm[p].x * W, y = lm[p].y * H;
            cx.font = `bold ${isKey?18:14}px sans-serif`;
            const tw = cx.measureText(text).width;
            cx.fillStyle = bg;
            cx.fillRect(x+8, y-22, tw+12, isKey?28:22);
            cx.fillStyle = fg;
            cx.fillText(text, x+14, y-6);
          };
          if (angle.elbow != null) drawLabel('肘角 ' + Math.round(angle.elbow) + '°', 13, '#fbbf24', '#1e1b4b');
          if (angle.hipShoulder != null) drawLabel('髋肩 ' + Math.round(angle.hipShoulder) + '°', 12, '#a78bfa', '#fff');
          if (angle.trunkTilt != null) drawLabel('躯干 ' + Math.round(angle.trunkTilt) + '°', 11, '#34d399', '#1e1b4b');
          // 顶部红条 — 标志关键帧
          cx.fillStyle = '#dc2626';
          cx.fillRect(0, 0, W, 8);
          cx.fillStyle = '#fff';
          cx.font = `bold ${isKey?20:16}px sans-serif`;
          cx.fillText('KEY FRAME · ' + idx, 12, isKey?36:28);
        }
      } else {
        // 没识别到关键点 — 加"未识别"标
        cx.fillStyle = 'rgba(0,0,0,0.6)';
        cx.fillRect(20, 20, W*0.4, 36);
        cx.fillStyle = '#fca5a5';
        cx.font = 'bold 18px sans-serif';
        cx.fillText('⚠ 未识别关键点', 32, 44);
      }
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => resolve(null);
    img.src = frame.dataUrl;
  });
}

// 选最关键的一帧（出手瞬间 ≈ 60% 处）画高清图
async function buildOverlayFrames() {
  if (!AI.frames || !AI.angles) return { keyDataUrl: null, stripDataUrls: [] };
  const numFrames = AI.frames.length;
  const releaseIdx = Math.max(0, Math.floor(numFrames * 0.6) - 1);
  // 高清关键帧
  const key = await drawPoseOverlay(AI.frames[releaseIdx], releaseIdx+1, AI.angles[releaseIdx], true);
  // 4 帧 strip：按时间均匀
  const indices = [];
  for (let i=0; i<4; i++) indices.push(Math.floor(i * numFrames / 4));
  const strip = [];
  for (const i of indices) {
    const isKey = i === releaseIdx;
    const d = await drawPoseOverlay(AI.frames[i], i+1, AI.angles[i], isKey);
    strip.push({ idx: i+1, dataUrl: d });
  }
  return { keyDataUrl: key, stripDataUrls: strip, keyIdx: releaseIdx };
}

// 严格按 DATA.pitches[] 最近 N 球，计算好球率分布。仅返回真实数字，不估算
function strikeZoneStats(N) {
  const all = (DATA.pitches || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const recent = all.slice(0, N);
  if (!recent.length) return null;
  let strikes = 0, balls = 0, totalSpeed = 0, speedCount = 0;
  const byZone = {}; // location 0-24 -> {s, b}
  for (const p of recent) {
    const loc = +p.location;
    if (!Number.isInteger(loc) || loc < 0 || loc > 24) continue;
    if (!byZone[loc]) byZone[loc] = { s: 0, b: 0 };
    if (p.isStrike) { byZone[loc].s++; strikes++; } else { byZone[loc].b++; balls++; }
    if (typeof p.speed === 'number') { totalSpeed += p.speed; speedCount++; }
  }
  const total = strikes + balls;
  // 四角统计：1, 5, 21, 25（捕手视角左上/右上/左下/右下）+ 中线（11,13,15）
  const corners = [0, 4, 20, 24];
  const cornersStrike = corners.reduce((acc, loc) => acc + (byZone[loc]?.s || 0), 0);
  const cornersBall   = corners.reduce((acc, loc) => acc + (byZone[loc]?.b || 0), 0);
  const cornersTotal  = cornersStrike + cornersBall;
  const mid = [10, 12, 14];
  const midStrike = mid.reduce((acc, loc) => acc + (byZone[loc]?.s || 0), 0);
  const midBall   = mid.reduce((acc, loc) => acc + (byZone[loc]?.b || 0), 0);
  // 找命中率最高/最低的位置（仅给出球 ≥2 的）
  const zoneStats = [];
  for (let i = 0; i < 25; i++) {
    const z = byZone[i];
    if (!z) continue;
    const t = z.s + z.b;
    if (t < 2) continue;
    zoneStats.push({ loc: i+1, hit: t ? Math.round(z.s/t*100) : 0, n: t });
  }
  zoneStats.sort((a,b) => b.hit - a.hit);
  const top = zoneStats.slice(0, 2);
  const bot = zoneStats.slice(-2).reverse();
  return {
    n: recent.length,
    used: total,
    strikeRate: total ? Math.round(strikes/total*100) : null,
    avgSpeed: speedCount ? +(totalSpeed/speedCount).toFixed(1) : null,
    corners: {
      strike: cornersStrike,
      ball: cornersBall,
      total: cornersTotal,
      hitRate: cornersTotal ? Math.round(cornersStrike/cornersTotal*100) : null
    },
    middle: {
      strike: midStrike,
      ball: midBall
    },
    topZones: top,
    bottomZones: bot,
    byZone
  };
}

function buildContextText(action) {
  const ZH = LANG==='zh';
  const lines = [];
  const fmtDate = (d) => (d||'').slice(0,10);
  const num = (v, decimals=0) => (typeof v === 'number' && !isNaN(v)) ? (+v).toFixed(decimals) : '—';
  const arrOrEmpty = (arr) => Array.isArray(arr) ? arr : [];

  const recentLogs = allLogs.slice(0, 5);

  const recentBody = arrOrEmpty(DATA.bodyLogs).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0, 3);
  const zone = strikeZoneStats(30);

  lines.push(ZH ? '【近期训练与比赛数据（仅供精准参考，请勿编造）】' : '【Recent training/match data (ground truth, do not fabricate)】');
  if (recentLogs.length) {
    const speeds = recentLogs.map(l => l.speed).filter(s => typeof s==='number');
    const pitches = recentLogs.map(l => l.pitchCount).filter(p => typeof p==='number');
    const moods = recentLogs.map(l => l.mood).filter(m => typeof m==='number');
    const avgSpeed = speeds.length ? (speeds.reduce((a,b)=>a+b,0)/speeds.length).toFixed(1) : '—';
    const maxSpeed = speeds.length ? Math.max(...speeds) : '—';
    const totalPitches = pitches.reduce((a,b)=>a+b, 0);
    const avgMood = moods.length ? (moods.reduce((a,b)=>a+b,0)/moods.length).toFixed(1) : '—';
    lines.push(ZH ?
      `近 ${recentLogs.length} 条训练/比赛记录：均速 ${avgSpeed} km/h（峰值 ${maxSpeed}），累计投球 ${totalPitches} 球，均信心 ${avgMood}/5。` :
      `Last ${recentLogs.length} entries: avg ${avgSpeed} km/h (peak ${maxSpeed}), total ${totalPitches} pitches, avg confidence ${avgMood}/5.`);
    lines.push('');
  }

  if (recentLogs.length) {
    lines.push(ZH ? '— 明细 —' : '— Detail —');
    recentLogs.forEach(l => {
      const isMatch = l.type === 'match';
      const tag = isMatch ? (ZH ? '【比赛】' : '[Match]') : (ZH ? '【训练】' : '[Train]');
      const zh = [
        `${tag} ${fmtDate(l.date)}`,
        `${isMatch ? '对手' : '来源'}：${isMatch ? (l.opponent||'—') : (l.source||'—')}`,
        typeof l.speed==='number' ? `球速 ${num(l.speed,1)} km/h` : '',
        typeof l.pitchCount==='number' ? `投球数 ${l.pitchCount}` : '',
        typeof l.mood==='number' ? `信心 ${l.mood}/5` : '',
        typeof l.strikeout==='number' && l.strikeout>0 ? `三振 ${l.strikeout}` : '',
        typeof l.struckOut==='number' && l.struckOut>0 ? `被三振 ${l.struckOut}` : '',
        typeof l.hits==='number' && l.hits>0 ? `安打 ${l.hits}` : '',
        typeof l.atBats==='number' && l.atBats>0 ? `打席 ${l.atBats}` : '',
        l.note ? `注：${l.note}` : ''
      ].filter(Boolean).join(' · ');
      const en = [
        `${tag} ${fmtDate(l.date)}`,
        `${isMatch ? 'Opp' : 'Source'}: ${isMatch ? (l.opponent||'—') : (l.source||'—')}`,
        typeof l.speed==='number' ? `speed ${num(l.speed,1)} km/h` : '',
        typeof l.pitchCount==='number' ? `pitches ${l.pitchCount}` : '',
        typeof l.mood==='number' ? `confidence ${l.mood}/5` : '',
        typeof l.strikeout==='number' && l.strikeout>0 ? `K ${l.strikeout}` : '',
        typeof l.struckOut==='number' && l.struckOut>0 ? `struckOut ${l.struckOut}` : '',
        typeof l.hits==='number' && l.hits>0 ? `hits ${l.hits}` : '',
        typeof l.atBats==='number' && l.atBats>0 ? `atBats ${l.atBats}` : '',
        l.note ? `note: ${l.note}` : ''
      ].filter(Boolean).join(' · ');
      lines.push(ZH ? zh : en);
    });
    lines.push('');
  } else {
    lines.push(ZH ? '⚠️ 暂无近期训练或比赛记录。' : '⚠️ No recent training/match records.');
    lines.push('');
  }

  if (recentReflections.length) {
    lines.push(ZH ? '— 历史反思要点 —' : '— Past Reflections —');
    recentReflections.forEach(r => {
      const parts = [];
      if (r.keep) parts.push(ZH ? `保持：${r.keep}` : `Keep: ${r.keep}`);
      if (r.improve) parts.push(ZH ? `改进：${r.improve}` : `Improve: ${r.improve}`);
      if (r.highlight) parts.push(ZH ? `亮点：${r.highlight}` : `Highlight: ${r.highlight}`);
      lines.push(`[${fmtDate(r.date)}] ${parts.join(' | ')}`);
    });
    lines.push('');
  }

  // ===== 9 宫格统计 =====
  if (zone && zone.used > 0) {
    lines.push(ZH ? '— 9宫格统计（最近30球，按捕手视角1-25号位置）—' : '— 9-zone stats (last 30 pitches, catcher view loc 1-25) —');
    lines.push(ZH ?
      `共 ${zone.used} 球（${zone.n} 条记录中可用），整体好球率 ${zone.strikeRate}%。${zone.avgSpeed!==null?`平均球速 ${zone.avgSpeed} km/h。`:''}` :
      `Total ${zone.used} pitches (from ${zone.n} records). Strike rate ${zone.strikeRate}%. ${zone.avgSpeed!==null?`Avg speed ${zone.avgSpeed} km/h.`:''}`);
    if (zone.corners.total > 0) {
      lines.push(ZH ?
        `四角位置（1/5/21/25号）共 ${zone.corners.total} 球，好球 ${zone.corners.strike}、坏球 ${zone.corners.ball}，命中率 ${zone.corners.hitRate}%。` :
        `Corners (loc 1/5/21/25): ${zone.corners.total} pitches, ${zone.corners.strike} strikes, ${zone.corners.ball} balls, hit rate ${zone.corners.hitRate}%.`);
    }
    if (zone.topZones.length) {
      const t = zone.topZones.map(z => `${z.loc}号${z.hit}%(${z.n}球)`).join('、');
      lines.push(ZH ? `最稳位置：${t}（好球率最高）。` : `Best zones: ${t}.`);
    }
    if (zone.bottomZones.length && zone.bottomZones[0].hit < zone.topZones[0]?.hit - 15) {
      const b = zone.bottomZones.map(z => `${z.loc}号${z.hit}%(${z.n}球)`).join('、');
      lines.push(ZH ? `最不稳位置：${b}。` : `Weakest zones: ${b}.`);
    }
    if (zone.middle.strike + zone.middle.ball > 0) {
      lines.push(ZH ?
        `中间位置（11/13/15号）共 ${zone.middle.strike+zone.middle.ball} 球，好球 ${zone.middle.strike}、坏球 ${zone.middle.ball}。` :
        `Middle (loc 11/13/15): ${zone.middle.strike+zone.middle.ball} pitches, ${zone.middle.strike} strikes, ${zone.middle.ball} balls.`);
    }
    lines.push('');
  }

  if (recentBody.length >= 2) {
    const first = recentBody[recentBody.length - 1];
    const last = recentBody[0];
    const dh = +((+last.height) - (+first.height)).toFixed(1);
    const dw = +((+last.weight) - (+first.weight)).toFixed(1);
    lines.push(ZH ?
      `身体成长：身高从 ${first.height}cm → ${last.height}cm（${dh>=0?'+':''}${dh}cm），体重 ${first.weight}kg → ${last.weight}kg（${dw>=0?'+':''}${dw}kg）。` :
      `Body: height ${first.height}cm → ${last.height}cm (${dh>=0?'+':''}${dh}cm), weight ${first.weight}kg → ${last.weight}kg (${dw>=0?'+':''}${dw}kg).`);
    lines.push('');
  }

  // 关键：明确告诉 AI 哪些数据是没给的，防止它"自己估"
  lines.push(ZH ?
    '【硬约束 · 重要】\n' +
    '上面提供的所有数字均来自实记数据，请严格引用。\n' +
    '以下指标在本期数据中**未给出**（不要说"大概""差不多"）：\n' +
    '- 各次训练的具体肘角/髋肩分离角/躯干侧倾（仅本次视频给出）\n' +
    '- 各次比赛的具体肘角\n' +
    '- 不同位置各自的肘角均值\n' +
    '如果 vs_recent / trend_note / load_note 需要谈"肘角均值""上次肘角"等，而上文未给数字，必须写"暂无该指标数据"。' :
    '[HARD CONSTRAINT]\n' +
    'All numbers above are from DATA. Cite exactly.\n' +
    'The following are NOT given in this data — DO NOT estimate:\n' +
    '- Per-session elbow/hip-shoulder/trunk angles (only THIS video has them)\n' +
    '- Per-pitch elbow angles by zone\n' +
    'If vs_recent/trend_note/load_note needs elbow avg and it\'s not provided, write "no data".'
  );

  return lines.join('\n');
}

  const hipShoulderPeak = +Math.max(...angles.filter(a=>a).map(a=>a.hipShoulder||0)).toFixed(1);
  const trunkPeak = +Math.max(...angles.filter(a=>a).map(a=>a.trunkTilt||0)).toFixed(1);
  const stanceMax = +Math.max(...angles.filter(a=>a).map(a=>a.stance||0)).toFixed(1);
  const ctx = buildContextText(action);
  const ctxNote = ctx.includes('⚠️ 暂无') ? (LANG==='zh' ? '【重要】本次分析因无近期数据，仅基于视频姿态。请明确在 problem 中说明"暂无可对比的近期数据"。' : '[Note] No recent data — analysis is pose-only. State that in problem.')

      : `训练："上周六5个三振你最稳，这次投球稳多了，下次我们练6个敢不敢？" / "9/3 vs 北区你 5 个 K，这次姿势比当时稳，肩部撑住就对了。" / "姐姐留意到你最近早训多投了 20 球，明天休息日一起去海边？"` +

  const userPrompt = ZH ?

    `  "load_note": "<30字内，对当前训练负荷的提醒（是否过多/过少，是否需要恢复）>",\n` +

    `  "encourage": "<10-30字，具体时间点+一件做对的事+下次的小约定/承诺，禁止套话>"\n` +

    `- Elbow at release: ${elbowAtRelease}° (ideal ~180°)\n` +
    `- Max elbow: ${elbowMax}°\n` +
    `- Peak hip-shoulder separation: ${hipShoulderPeak}° (good pitchers ≥55°)\n` +
    `- Peak trunk tilt: ${trunkPeak}° (ideal <10°)\n` +
    (stanceMax > 0 ? `- Stance width: ${stanceMax}px\n` : '') +

    `  "load_note": "<≤30 chars, load warning>",\n` +

    `  "encourage": "<10-30 chars, time anchor + concrete right-doing + next-step invitation, no cliches>"\n` +
    `}`;

  return { sysPrompt, userPrompt };
}

function parseLLMJson(text, fallback) {
  const json = String(text||'').trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
  let parsed = null;
  try { parsed = JSON.parse(json); }
  catch(e) {
    const m = json.match(/\{[\s\S]*\}/);
    if (m) { try { parsed = JSON.parse(m[0]); } catch(e2) {} }
  }
  if (!parsed) throw new Error(LANG==='zh'?'AI 返回格式异常: '+json.slice(0,80) : 'Bad AI response: '+json.slice(0,80));
  // 兼容两种 schema:
  // 新版 v8.2: {pose_score, pose_problem, pose_tips[3], vs_recent, trend_note, load_note, tips[3], encourage}
  // 旧版 v8.1: {score, problem, secondary, tips[3], encourage}
  const isV82 = parsed && ('pose_score' in parsed || 'pose_problem' in parsed || 'vs_recent' in parsed);
  if (isV82) {
    const tips = Array.isArray(parsed.tips) && parsed.tips.length===3 ? parsed.tips.map(s=>String(s)) : fallback.tips;
    const pose_tips = Array.isArray(parsed.pose_tips) && parsed.pose_tips.length===3 ? parsed.pose_tips.map(s=>String(s)) : fallback.tips;
    return {
      score: Math.max(0, Math.min(100, Math.round(+parsed.pose_score || fallback.score))),
      problem: { label: fallback.problem.label, msg: String(parsed.pose_problem||fallback.problem.msg) },
      pose_tips,
      vs_recent: String(parsed.vs_recent || (LANG==='zh'?'暂无近期数据参考':'No recent data')),
      zone_note: String(parsed.zone_note || ''),
      trend_note: String(parsed.trend_note || ''),
      load_note: String(parsed.load_note || ''),
      tips,
      encourage: String(parsed.encourage || fallback.encourage),
      secondary: null,
      schema: 'v8.2'
    };
  }
  // 旧版兼容
  return {
    score: Math.max(0, Math.min(100, Math.round(+parsed.score || fallback.score))),
    problem: { label: fallback.problem.label, msg: String(parsed.problem||fallback.problem.msg) },
    pose_tips: null,
    vs_recent: '',
    trend_note: '',
    load_note: '',
    secondary: parsed.secondary ? { label: fallback.secondary?.label || '', msg: String(parsed.secondary) } : null,
    tips: Array.isArray(parsed.tips) && parsed.tips.length===3 ? parsed.tips.map(s=>String(s)) : fallback.tips,
    encourage: String(parsed.encourage||fallback.encourage),
    schema: 'v8.1'
  };
}

// OpenAI 兼容协议（智谱 GLM / DeepSeek 共用）
async function callOpenAICompat(url, key, model, sysPrompt, userPrompt, fallback) {
  const body = {
    model: model,
    messages: [
      { role:'system', content: sysPrompt },
      { role:'user', content: userPrompt }
    ],
    temperature: 0.15,
    max_tokens: 1100,
    response_format: { type: 'json_object' }
  };
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    const errTxt = await resp.text().catch(()=>'');
    throw new Error('HTTP '+resp.status+': '+(errTxt.slice(0,180)||resp.statusText));
  }
  const data = await resp.json();
  const text = data?.choices?.[0]?.message?.content || '';
  return parseLLMJson(text, fallback);
}

async function callGeminiCompat(key, model, sysPrompt, userPrompt, fallback) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
  const body = {
    contents: [{ role:'user', parts:[{ text: userPrompt }] }],
    systemInstruction: { parts:[{ text: sysPrompt }] },
    generationConfig: { temperature: 0.15, maxOutputTokens: 1100, responseMimeType: 'application/json' }
  };
  const resp = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!resp.ok) {
    const errTxt = await resp.text().catch(()=>'');
    throw new Error('HTTP '+resp.status+': '+(errTxt.slice(0,180)||resp.statusText));
  }
  const data = await resp.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  return parseLLMJson(text, fallback);
}

async function callLLMCoach(action, angles, fallback) {
  if (!LLM.enabled || !LLM.apiKey) throw new Error(LANG==='zh'?'AI 教练未启用':'AI Coach not enabled');
  const { sysPrompt, userPrompt } = buildPrompts(action, angles);
  const model = llmModel();
  if (LLM.provider === 'zhipu') {
    return callOpenAICompat('https://open.bigmodel.cn/api/paas/v4/chat/completions', LLM.apiKey, model, sysPrompt, userPrompt, fallback);
  }
  if (LLM.provider === 'deepseek') {
    return callOpenAICompat('https://api.deepseek.com/chat/completions', LLM.apiKey, model, sysPrompt, userPrompt, fallback);
  }
  return callGeminiCompat(LLM.apiKey, model, sysPrompt, userPrompt, fallback);
}

// 「测试连接」用：轻量 ping
async function pingLLM() {
  if (!LLM.apiKey) throw new Error(LANG==='zh'?'请先填写 API Key':'Enter API Key first');
  const model = llmModel();
  if (LLM.provider === 'zhipu' || LLM.provider === 'deepseek') {
    const url = LLM.provider==='zhipu'
      ? 'https://open.bigmodel.cn/api/paas/v4/chat/completions'
      : 'https://api.deepseek.com/chat/completions';
    const resp = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+LLM.apiKey },
      body: JSON.stringify({ model, messages:[{role:'user',content:'Reply with exactly: OK'}], max_tokens: 10 })
    });
    if (!resp.ok) { const t1 = await resp.text().catch(()=>''); throw new Error('HTTP '+resp.status+': '+(t1.slice(0,150)||resp.statusText)); }
    const d = await resp.json();
    return d?.choices?.[0]?.message?.content || 'OK';
  }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(LLM.apiKey)}`;
  const resp = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({contents:[{role:'user',parts:[{text:'Reply with exactly: OK'}]}]}) });
  if (!resp.ok) { const t1 = await resp.text().catch(()=>''); throw new Error('HTTP '+resp.status+': '+(t1.slice(0,150)||resp.statusText)); }
  const d = await resp.json();
  return d?.candidates?.[0]?.content?.parts?.[0]?.text || 'OK';
}

async function runAIEval() {
  try {
    const out = await callLLMCoach(AI.action, AI.angles, AI.fallbackEval);
    AI.feedback = out;
    AI.feedbackSource = 'cloud';
    AI.state = 'result';
  } catch(e) {
    AI.feedback = AI.fallbackEval;
    AI.feedbackSource = 'mock-fallback';
    AI.state = 'result';
    setTimeout(()=> toast('⚠️ '+e.message, 4000), 300);
  }
  renderAIStep();
}

function resultHTML() {
  AI.feedback = AI.feedback || mockCoachEval(AI.angles);
  const ev = AI.feedback;
  const ZH = LANG==='zh';
  const angStrip = (vals, color) => {
    if (!vals.length) return '';
    const max = Math.max(...vals.map(v=>Math.abs(v||0)), 1);
    const w = 100/vals.length;
    return vals.map((v,i) => v==null ? `<div style="background:#475569;width:${w}%;height:100%;display:inline-block"></div>` : `<div style="background:${color};width:${w}%;height:${(Math.abs(v)/max)*100}%;display:inline-block;vertical-align:bottom" title="${v.toFixed(1)}°"></div>`).join('');
  };
  const svElbow = angStrip(AI.angles.map(a=>a&&a.elbow), '#fbbf24');
  const svHS = angStrip(AI.angles.map(a=>a&&a.hipShoulder), '#a78bfa');
  const svTrunk = angStrip(AI.angles.map(a=>a&&a.trunkTilt), '#34d399');
  const isSwing = AI.action === 'swing';
  const hasRecent = (ev.vs_recent && ev.vs_recent.length > 0) || (ev.trend_note && ev.trend_note.length > 0) || (ev.zone_note && ev.zone_note.length > 0);
  const sourceBanner = AI.feedbackSource==='cloud'
    ? `<div style="background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:10px"><b>${t('ai_using_gemini')} · ${llmLabel()}</b></div>`

      : `<p style="color:#64748b;font-size:11px;margin-top:10px">${t('ai_using_mock')}</p>`;
  const redoBtn = LLM.enabled && LLM.apiKey
    ? `<button class="opt-btn" style="flex:1;background:#7c3aed;color:#fff" id="aiRedoAI">${t('ai_redo_gemini')}</button>`
    : (AI.feedbackSource==='cloud' || AI.feedbackSource==='mock-fallback'
       ? `<button class="opt-btn" style="flex:1;background:#334155" id="aiRedoMock">${t('ai_redo_mock')}</button>`
       : '');

  // ===== 块 1: 视频姿态评分（永远是核心） =====
  const poseBlock = `
    <div style="background:#1e1b4b;border:1px solid #4338ca;border-radius:10px;padding:12px;margin-top:10px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <span class="score" style="font-size:26px;background:#fbbf24;color:#1e1b4b;padding:5px 14px;border-radius:20px;font-weight:700">${ev.score}</span>
        <div>
          <div style="color:#e0e7ff;font-size:12px;font-weight:600">${t('ai_section_pose')}</div>
          <div style="color:#94a3b8;font-size:11px">${isSwing ? (ZH?'打击动作':'Batting') : (ZH?'投球动作':'Pitching')} · ${ZH?'仅基于本次视频':'Pose only'}</div>
        </div>
      </div>
      <div style="color:#fcd34d;font-size:13px;font-weight:600;margin-bottom:4px">🔍 ${t('ai_problem')}</div>
      <div style="color:#fde68a;font-size:12px;background:#312e81;border-radius:6px;padding:8px">${ev.problem.msg}</div>
      ${ev.pose_tips && ev.pose_tips.length ? `
        <div style="color:#a5b4fc;font-size:12px;font-weight:600;margin:10px 0 4px">🎯 ${t('ai_pose_tips_title')}</div>
        ${ev.pose_tips.map(t1 => `<div style="color:#e0e7ff;font-size:11px;padding:4px 0;border-bottom:1px dashed #312e81">• ${t1}</div>`).join('')}
      ` : ''}
    </div>
  `;

  // ===== 块 2: 近期数据对比（如果有数据） =====
  let compareBlock = '';
  if (hasRecent || AI.feedbackSource==='cloud') {
    const cells = [];
    if (ev.vs_recent) cells.push({ k: t('ai_vs_recent_title'), v: ev.vs_recent, c: '#7dd3fc' });
    if (ev.zone_note) cells.push({ k: t('ai_zone_title')||(ZH?'📍 9宫格战术':'📍 9-Zone'), v: ev.zone_note, c: '#fb923c' });
    if (ev.trend_note) cells.push({ k: t('ai_trend_title'), v: ev.trend_note, c: '#86efac' });
    if (ev.load_note)  cells.push({ k: t('ai_load_title'),  v: ev.load_note, c: '#fcd34d' });
    compareBlock = `
      <div style="background:#1f2937;border:1px solid #0891b2;border-radius:10px;padding:12px;margin-top:10px">
        <div style="color:#67e8f9;font-size:13px;font-weight:600;margin-bottom:8px">${t('ai_section_compare')}</div>
        ${cells.length ? cells.map(c => `
          <div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #374151;align-items:flex-start">
            <div style="background:${c.c};color:#1f2937;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;flex-shrink:0;max-width:90px">${c.k}</div>
            <div style="color:#e5e7eb;font-size:12px;line-height:1.5">${c.v}</div>
          </div>
        `).join('') : `<div style="color:#94a3b8;font-size:12px">${t('ai_no_recent')}</div>`}
      </div>
    `;
  }

  // ===== 块 3: 综合训练建议 =====
  const tipsBlock = `
    <div style="background:#312e81;border:1px solid #fbbf24;border-radius:10px;padding:12px;margin-top:10px">
      <div style="color:#fde68a;font-size:13px;font-weight:600;margin-bottom:8px">${t('ai_section_tips')}</div>
      ${ev.tips.map((t1, i) => `
        <div style="display:flex;gap:8px;padding:7px 0;border-bottom:${i<ev.tips.length-1?'1px solid #4338ca':'none'};align-items:flex-start">
          <div style="background:#fbbf24;color:#1e1b4b;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</div>
          <div style="color:#fef3c7;font-size:12px;line-height:1.5">${t1}</div>
        </div>
      `).join('')}
    </div>
  `;

  // ===== 块 4: 给莀安的话 =====
  // 训练/比赛场景提示 — 让语气切换可见
  const sceneTag = AI.context === 'match' ? (ZH?'🏆 比赛场景 · 教练腔':'🏆 Match · Coach-tone') : (ZH?'🏋️ 训练场景 · 姐姐腔':'🏋️ Training · Sister-tone');
  const encourageBlock = `
    <div style="background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #f59e0b;border-radius:10px;padding:12px;margin-top:10px;color:#78350f">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;font-weight:600">${t('ai_section_encourage')}</span>
        <span style="background:#f59e0b;color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600">${sceneTag}</span>
      </div>
      <div style="font-size:13px;line-height:1.6;font-style:italic">"${ev.encourage}"</div>
    </div>
  `;

  // ===== 块 5: 关键帧姿态叠图 =====
  let overlayBlock = '';
  if (AI.overlayKey) {
    const stripHtml = (AI.overlayStrip||[]).map(o => o.dataUrl
      ? `<div style="position:relative;flex:1;border-radius:6px;overflow:hidden;background:#000"><img src="${o.dataUrl}" style="width:100%;height:100%;object-fit:cover"/><span style="position:absolute;top:4px;left:4px;background:#7c3aed;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px">#${o.idx}</span></div>`
      : `<div style="flex:1;background:#1e293b;border-radius:6px;height:60px"></div>`
    ).join('');
    overlayBlock = `
      <div style="background:#0f172a;border:1px solid #fbbf24;border-radius:10px;padding:10px;margin-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="color:#fde68a;font-size:13px;font-weight:600">${t('ai_overlay_title')}</div>
          <button onclick="exportOverlayPNG()" style="background:#fbbf24;color:#1e1b4b;border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer">${t('ai_overlay_dl')}</button>
        </div>
        <div style="color:#94a3b8;font-size:11px;margin-bottom:6px">${t('ai_overlay_sub')}</div>
        <img src="${AI.overlayKey}" style="width:100%;border-radius:6px;background:#000;margin-bottom:6px"/>
        <div style="display:flex;gap:6px;height:60px">${stripHtml}</div>
      </div>
    `;
  } else if (AI.frames && AI.frames.length > 0) {
    overlayBlock = `
      <div style="background:#0f172a;border:1px solid #475569;border-radius:10px;padding:10px;margin-top:10px;text-align:center;color:#94a3b8;font-size:12px">
        ${t('ai_overlay_render')}

  }

  // ===== 折叠：原始姿态曲线（老用户也能看） =====
  const poseGrid = `
    <details style="margin-top:14px">
      <summary style="color:#94a3b8;font-size:11px;cursor:pointer;padding:4px 0">${ZH?'📈 查看原始姿态曲线（16帧角度变化）':'📈 Raw pose curves (16 frames)'}</summary>
      <div style="padding-top:8px">
        <h4 style="margin:4px 0">${t('ai_metric_elbow')}</h4>

  return `<div class="step-card">

function bindResult() {
  document.getElementById('aiRedo').onclick = () => {
    if (AI.videoUrl) { URL.revokeObjectURL(AI.videoUrl); AI.videoUrl = null; }
    AI.frames = null; AI.angles = null; AI.feedback = null; AI.fallbackEval = null;
    AI.state = 'choose-action';
    renderAIStep();
  };
  const redoAI = document.getElementById('aiRedoAI');
  if (redoAI) {
    redoAI.onclick = () => {
      if (!LLM.enabled || !LLM.apiKey) { toast(t('ai_settings_need_key')); return; }
      AI.feedback = null;
      AI.state = 'ai-eval';
      renderAIStep();
    };
  }
  const redoMock = document.getElementById('aiRedoMock');
  if (redoMock) {
    redoMock.onclick = () => {
      AI.feedback = mockCoachEval(AI.angles);
      AI.feedbackSource = 'mock';
      AI.state = 'result';
      renderAIStep();
    };
  }
  document.getElementById('aiSave').onclick = () => {
    const ev = AI.feedback || mockCoachEval(AI.angles);
    const ZH = LANG==='zh';
    const srcTag = AI.feedbackSource==='cloud' ? '☁️ '+llmLabel() : '📐 本地';
    const dateStr = new Date().toISOString().slice(0,10);
    const lines = [];
    lines.push(`${srcTag} · ${ZH ? '动作评分' : 'Score'} ${ev.score}/100`);
    if (ev.vs_recent) lines.push(`📊 ${ZH?'近期对比':'vs recent'}: ${ev.vs_recent}`);
    if (ev.zone_note) lines.push(`📍 ${ZH?'9宫格战术':'9-Zone'}: ${ev.zone_note}`);
    if (ev.trend_note) lines.push(`📈 ${ZH?'趋势':'Trend'}: ${ev.trend_note}`);
    if (ev.load_note) lines.push(`⚖️ ${ZH?'负荷':'Load'}: ${ev.load_note}`);
    const sceneTag = AI.context === 'match' ? (ZH?'🏆比赛':'🏆Match') : (ZH?'🏋️训练':'🏋️Training');
    const r = {
      date: dateStr,
      type: 'train',
      source: AI.feedbackSource==='cloud' ? 'self' : 'self',
      keep: `${sceneTag} · ` + lines.join(' / '),
      improve: ev.problem.msg + (ev.pose_tips ? `\n🎯 ${ZH?'动作要点':'Pose'}: ${ev.pose_tips.join(' | ')}` : ''),
      highlight: ev.encourage
    };
    DATA.reflections.unshift(r);
    // v8.4：把鼓励话单独归档到 supportNotes（面试时可翻历史）
    if (ev.encourage && ev.encourage.trim().length>0) {
      DATA.supportNotes.unshift({
        date: dateStr,
        action: AI.action,
        context: AI.context,
        source: AI.feedbackSource==='cloud' ? ('cloud:'+llmLabel()) : 'local',
        text: ev.encourage
      });
      // 最多保留 30 条历史
      if (DATA.supportNotes.length > 30) DATA.supportNotes.length = 30;
    }
    saveData(DATA);
    DATA.reflections[0].improve += `\n💡 ${ZH?'综合':'Synthesis'}: ${ev.tips.join(' | ')}`;
    saveData(DATA);
    toast('✓ ' + (ZH?'已保存（含历史鼓励话归档）':'Saved + encouragement archived'));
    closeAICoach();
  };
}
